name: Custom Android prototype
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.21.1"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install dependencies without Electron lifecycle scripts
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - name: Check shared code and contracts
        run: |
          yarn typecheck
          yarn test
      - name: Build Android renderer and synchronize native project
        run: yarn android:sync
      - name: Install Chromium for the phone smoke test
        run: yarn playwright install --with-deps chromium
      - name: Verify the offline phone workflow in Chromium
        run: yarn test:android
      - name: Build debug APK without publishing
        working-directory: android
        run: bash gradlew --no-daemon assembleDebug
      - name: Upload prototype APK
        uses: actions/upload-artifact@v4
        with:
          name: koodo-reader-custom-android-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload failed browser checks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
